# Global configuration for MoEInfra
model:
  name: mistralai/Mixtral-8x7B-v0.1
  num_experts: 8
  num_experts_per_tok: 2
  num_layers: 32
  hidden_size: 4096
  intermediate_size: 14336
  quantization: int4

cache:
  gpu_slots: 8
  cpu_slots: 32
  eviction_policy: lru

transfer:
  bandwidth_gbps: 8.0
  prefetch_depth: 2
  max_concurrent_transfers: 4

logging:
  level: INFO
  file: logs/moeinfra.log

metrics:
  enabled: true
  export_interval_s: 10
